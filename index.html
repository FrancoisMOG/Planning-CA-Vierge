<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning et CA</title>
<style>
:root{
  --bg:#f3f5f6; --panel:#fff; --ink:#15222b; --muted:#5c6b75; --line:#d5dde2; --soft:#eef2f4; --cell:#f6f8f9;
  --ses:#0f766e; --sesf:#d5eae7; --app:#c2410c; --appf:#f7dccf; --new:#1d4ed8; --newf:#dce6f7; --neu:#8a99a3; --neuf:#e6e9ec; --fp:#7c3aed; --fpf:#ece4fb; --fpi:#be185d; --fpif:#fbe0ec;
  --err:#b91c1c; --errf:#fdecec; --ok:#15803d;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Calibri,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--new);outline-offset:2px}

/* Barre du haut */
.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-weight:700;font-size:16px;margin-right:6px}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#2b3a44}
.btn.danger{color:var(--err);border-color:#f0c9c9}
.btn.danger.armed{background:var(--err);color:#fff;border-color:var(--err)}
.btn.small{padding:4px 9px;font-size:13px}
.status{font-size:12px;color:var(--muted);min-width:120px}
.status.ok{color:var(--ok)}

main{max-width:1500px;margin:0 auto;padding:18px 16px 60px}
.view[hidden]{display:none!important}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:22px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-size:24px;margin:4px 0 4px}
h2{font-size:18px;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 14px}
.lead b{color:var(--ink)}

/* Tableau CA */
.scroll{overflow-x:auto}
table.ca{border-collapse:collapse;width:100%;min-width:1180px;table-layout:fixed}
table.ca th,table.ca td{border:1px solid var(--line);padding:5px 6px;vertical-align:middle}
table.ca thead th{background:var(--soft);font-size:11.5px;color:var(--muted);font-weight:600}
table.ca th.m{text-align:center}
table.ca .num{text-align:right;font-variant-numeric:tabular-nums}
table.ca .money{background:var(--cell)}
table.ca .grp td{border-left:0;border-right:0;background:transparent;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding-top:12px}
.fname{font-weight:700;font-size:13px}
.fsub{font-size:11px;color:var(--muted)}
.big{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.tiny{font-size:10.5px;color:var(--muted);line-height:1.3}
td.mc{font-size:10.5px;font-weight:700;text-align:center;line-height:1.2;padding:3px 2px!important}
td.cur-a{background:var(--sesf);color:var(--ses)}
td.cur-p{background:var(--appf);color:var(--app)}
td.cur-n{background:var(--neuf);color:var(--muted)}
td.cur-f{background:var(--fpf);color:var(--fp)}
td.cur-i{background:var(--fpif);color:var(--fpi)}
td.nw{background:var(--newf);color:var(--new)}
tr.neutral .fname,tr.neutral .big{color:var(--muted)}
tr.tot td{background:var(--soft);font-weight:700}
tr.tot.grand td{font-size:16px}
.warn{color:var(--err);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.note{font-size:11.5px;color:var(--muted);font-style:italic;margin:6px 0 0}

/* Qui finit quand */
table.qf{border-collapse:collapse;width:100%}
table.qf th{background:var(--soft);text-align:left;font-size:12px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
table.qf td{padding:7px 8px;vertical-align:top}
table.qf tr.first td{border-top:1.5px solid #8a99a3}
.qd{font-weight:700;font-size:15px}
.chip{display:inline-block;background:var(--soft);border-radius:4px;padding:1px 7px;margin:2px 4px 2px 0;font-size:13px}
.chip small{color:var(--muted);font-size:10.5px;margin-left:4px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
ul.hors{margin:4px 0 0;padding-left:20px;color:var(--muted)}

/* Édition */
.edit-intro{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.card>summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.card>summary::-webkit-details-marker{display:none}
.card>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.card[open]>summary::before{transform:rotate(90deg)}
.card .ct{font-weight:700}
.card .cs{color:var(--muted);font-size:13px}
.card .cr{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.card .body{padding:4px 16px 16px;border-top:1px solid var(--soft)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px 14px;margin-top:10px}
.f{display:grid;gap:3px;align-content:start}
.f label{font-size:12px;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff;width:100%}
.f input[aria-invalid="true"]{border-color:var(--err);background:var(--errf)}
.f .msg{font-size:11.5px;color:var(--err);min-height:0}
.f .hint{font-size:11.5px;color:var(--muted)}
.f.wide{grid-column:1/-1}
.f.wide2{grid-column:span 2}
@media (max-width:600px){.f.wide2{grid-column:1/-1}}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:18px}
.sub{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
table.ap{border-collapse:collapse;width:100%;min-width:760px}
table.ap th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:4px 6px}
table.ap td{padding:3px 4px}
table.ap input{border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;background:#fff}
table.ap input[aria-invalid="true"]{border-color:var(--err);background:var(--errf)}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sect-title{display:flex;align-items:center;gap:12px;margin:22px 0 10px}
.sect-title h2{margin:0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.ca-head{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.ca-head .seg button{font-size:13px;padding:6px 12px}
.reps{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 24px;margin-top:14px}
table.rep{border-collapse:collapse;width:100%;font-size:12.5px}
table.rep th{text-align:left;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:4px 6px}
table.rep td{border-bottom:1px solid var(--soft);padding:4px 6px}
table.rep .num{text-align:right;font-variant-numeric:tabular-nums}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--newf);border:1px solid #b9cbee;border-radius:8px;padding:10px 14px;margin-bottom:12px}
.pers{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-top:12px}
.per{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--cell)}
.per-t{font-weight:700;font-size:13px}
.per .fields{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));margin-top:6px}
.sub.f{margin-bottom:-4px}
.btn.save{background:#15803d;border-color:#15803d;color:#fff}
.btn.save:hover{background:#166534}
.preview{margin:10px 0 4px;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;background:var(--cell)}
.pv-t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
table.ca.mini{min-width:980px}
table.ca.mini th,table.ca.mini td{padding:3px 5px}
.per.ref{margin-top:12px;background:#fff}

/* Éditeur : liste à gauche, fiche à droite */
.ed{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.ed-side{position:sticky;top:70px;max-height:calc(100vh - 86px);overflow:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding-bottom:10px}
.ed-tools{display:grid;gap:8px}
.ed-tools .btn.save{width:100%;padding:10px 12px;font-weight:600}
.ed-tools2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ed-g{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ed-gh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);background:var(--soft)}
.ed-g.ga .ed-gh{color:var(--ses)} .ed-g.gp .ed-gh{color:var(--app)} .ed-g.gf .ed-gh{color:var(--fp)} .ed-g.gi .ed-gh{color:var(--fpi)}
.ed-gh .btn{text-transform:none;letter-spacing:0;font-weight:500;padding:3px 8px;font-size:12px}
.ed-row{display:flex;align-items:stretch;border-bottom:1px solid var(--soft)}
.ed-row:last-child{border-bottom:0}
.ed-row .ed-item{border-bottom:0;flex:1;min-width:0}
.ed-del{border:0;border-left:1px solid var(--soft);background:transparent;color:var(--err);font-size:11px;padding:0 8px;opacity:.55}
.ed-row:hover .ed-del,.ed-row.on .ed-del,.ed-del:focus-visible{opacity:1}
.ed-del:hover{background:var(--errf)}
.ed-del.armed{background:var(--err);color:#fff;opacity:1}
.kpi-del{display:flex;align-items:center}
.ed-item{display:grid;grid-template-columns:1fr auto;gap:0 8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--soft);background:transparent;padding:8px 10px;border-left:3px solid transparent}
.ed-item:last-child{border-bottom:0}
.ed-item:hover{background:var(--cell)}
.ed-item.on{background:#eef4ff;border-left-color:var(--new)}
.ei-n{font-weight:600;font-size:13px;grid-column:1}
.ei-s{font-size:11px;color:var(--muted);grid-column:1}
.ei-v{grid-column:2;grid-row:1/3;align-self:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.ed-reset{text-align:center}
.ed-side .banner{display:grid;gap:6px;margin:0;font-size:12.5px}
.ed-main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.ed-head{display:flex;flex-wrap:wrap;gap:14px 24px;justify-content:space-between;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c,var(--ink));border-radius:10px;padding:14px 18px}
.ed-head h2{margin:2px 0;font-size:22px}
.ed-kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi{display:grid;gap:2px;background:var(--cell);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:150px}
.kpi span{font-size:11px;color:var(--muted)}
.kpi b{font-size:20px;font-variant-numeric:tabular-nums}
.kpi.s{min-width:170px}.kpi.s b{font-size:18px}
.kpi.tot{background:#eef4ff;border-color:#b9cbee}
.kpi small{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ed-main .preview{margin:0;background:var(--panel)}
.ed-nav{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:62px;z-index:2;background:var(--bg);padding:6px 0}
.ed-nav a{font-size:12.5px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px}
.ed-nav a:hover{background:var(--soft)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;scroll-margin-top:110px}
.sec h3{margin:0 0 4px;font-size:15px}
.sec-n{margin:0 0 6px;font-size:12px;color:var(--muted)}
.chks{display:flex;flex-wrap:wrap;gap:4px 24px}
.dur-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.dur{border:1px solid var(--line);border-radius:8px;padding:8px 12px 4px}
.dur.c{background:var(--sesf);border-color:#b7dcd6}
.dur.e{background:#fdf1e7;border-color:#f3d2b6}
.dur.t{background:var(--cell)}
.dur-v{font-size:20px;font-weight:700;padding:4px 0}
table.plan{border-collapse:collapse;width:100%;min-width:900px;margin-top:4px}
table.plan th{font-size:11.5px;color:var(--muted);font-weight:600;padding:4px;text-align:center}
table.plan tbody th{text-align:left;font-size:12.5px;color:var(--ink);white-space:nowrap;padding-right:8px}
table.plan td{padding:2px}
table.plan input{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 4px;text-align:center;background:#fff;font-variant-numeric:tabular-nums}
table.plan tr.rc input{background:#f2faf8}
table.plan tr.re input{background:#fff8f2}
table.plan input[aria-invalid="true"]{border-color:var(--err);background:var(--errf)}
table.plan .sep{border-left:2px dashed #9fb5e6}
.per.bdcid{margin-top:12px;background:var(--cell)}
.per.bdcid .fields{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.yr-tabs{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.yr{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 22px;font-size:15px;font-weight:700}
.yr.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ca26{background:var(--cell);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0 10px}
table.ap.ro td{padding:5px 6px;border-bottom:1px solid var(--soft);font-size:13px}
table.ap.ro .num{text-align:right;font-variant-numeric:tabular-nums}
.kpi.k26{background:#fffaf0;border-color:#ecdcb8}
.zone{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:8px}
.zone.zc{background:#f2faf8;border-color:#b7dcd6}
.zone.zr{background:#f3f7ff;border-color:#c9d8f5}
.zone.off .fields{opacity:.55}
.zres{margin-top:10px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;font-size:13px}
.plan-btns{display:flex;flex-wrap:wrap;gap:6px}
.plan-ecart:empty{display:none}
.plan-ecart{margin-top:6px}
table.plan tr.rt td,table.plan tr.rt th{border-top:1px solid var(--line);padding-top:5px;font-variant-numeric:tabular-nums}
table.plan tr.rt td{text-align:center;font-size:12.5px;color:var(--muted)}
table.plan td.num{text-align:right;padding:0 6px;white-space:nowrap}
.plan-foot{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.per.p2{background:#f3f7ff;border-color:#c9d8f5}
.ed-danger{text-align:right}
@media (max-width:900px){
  .ed{grid-template-columns:minmax(0,1fr)}
  .ed-side{position:static;max-height:none}
  .ed-nav{top:0}
}
.errbox{background:var(--errf);color:var(--err);border:1px solid #f0c9c9;border-radius:8px;padding:10px 14px;margin-bottom:14px}

/* CA global */
.g-kpis{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 16px}
.g-kpis .kpi{flex:1 1 180px}
.g-kpis .kpi.tot{background:#eef7f1;border-color:#b9dcc6}
table.gt{border-collapse:collapse;width:100%;font-size:13px}
table.gt th{text-align:right;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);padding:6px 8px;white-space:nowrap}
table.gt th:first-child,table.gt td:first-child{text-align:left}
table.gt td{border-bottom:1px solid var(--soft);padding:5px 8px;vertical-align:top;text-align:right;font-variant-numeric:tabular-nums}
table.gt tr.tot td{font-weight:700;border-top:2px solid var(--line);background:var(--cell)}
table.gt th.gl,table.gt td.gl{background:#f6faf7}
table.gt .gsub{display:block;font-size:11px;line-height:1.3;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
table.gt td.neu{color:var(--muted)}
.g-h2{margin:22px 0 8px;font-size:16px}
/* Accueil */
.seg[hidden]{display:none}
.seg button:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.intro{max-width:980px;margin:0 auto 22px}
.intro h1{font-size:26px}
.intro-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.yr-edit{display:flex;gap:8px;align-items:center;margin:8px 0 4px}
.yr-edit input{width:110px;text-align:center;font-size:22px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
.yr-edit .btn{font-size:18px;padding:6px 14px}
.intro .msg{font-size:12px;color:var(--err);min-height:0}
.intro .f input{border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;margin-top:4px}
.et-list{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.et-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--cell)}
.et-n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.et-in{flex:1 1 220px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-weight:600;background:#fff}
.et-s{font-size:12px;color:var(--muted);white-space:nowrap}
.et-b{display:flex;gap:6px;flex-wrap:wrap}
.et-add{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.et-add input{flex:1 1 240px;min-width:0;border:1px dashed #9fb5e6;border-radius:8px;padding:8px 10px;background:#fff}
.intro-go{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:16px}
.intro-go .btn.save{padding:11px 22px;font-size:15px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Impression A3 paysage */
@page{size:A3 landscape;margin:10mm}
@media print{
  body{background:#fff;font-size:12px}
  .top,.no-print,#view-edit,#view-intro{display:none!important}
  main{max-width:none;padding:0}
  .view[hidden]{display:block!important}
  #view-edit[hidden],#view-intro[hidden]{display:none!important}
  .sheet{border:0;border-radius:0;padding:0;margin:0}
  #view-qf{break-before:page}
  body:not(.pg) #view-global{display:none!important}
  body.pg #view-ca,body.pg #view-qf{display:none!important}
  #view-global .sheet{zoom:0.9}
  table.gt{font-size:11px} table.gt td,table.gt th{padding:3px 6px}
  .toast,#errbox{display:none!important}
  .reps{grid-template-columns:repeat(3,1fr)}
  #view-ca .sheet{zoom:0.87}
  table.ca th,table.ca td{padding:3px 5px}
  .fname{font-size:12.5px}.big{font-size:13.5px}.tiny{font-size:9.5px;line-height:1.2}.fsub{font-size:9.5px}td.mc{font-size:9.5px}
  table.ca .grp td{padding-top:6px;font-size:10.5px}
  h1{font-size:20px;margin:2px 0}.lead{margin:0 0 8px}
  table.qf td{padding:3px 8px}.qd{font-size:13px}.chip{font-size:11.5px;padding:0 6px;margin:1px 3px 1px 0}
  table.rep{font-size:11px}table.rep td,table.rep th{padding:2px 6px}

<script>
"use strict";
/* ============ Modèle vierge : aucune donnée pré-remplie ============ */

/* ============ Outils ============ */
let YEAR = new Date().getFullYear(); /* année de travail : modifiable dans la page d'accueil */
let Y26 = YEAR - 1;     /* année précédente */
function setAnnee(a){ a = Math.round(Number(a)); if (!isFinite(a) || a < 2000 || a > 2100) return false; YEAR = a; Y26 = a - 1; return true; }
const MOIS = ["Janv.","Févr.","Mars","Avr.","Mai","Juin","Juil.","Août","Sept.","Oct.","Nov.","Déc."];
const MOISL = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const MOISC = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const clone = o => JSON.parse(JSON.stringify(o));
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
function parseDate(s){
  if (typeof s !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
  const [y,m,d] = s.split("-").map(Number);
  const dt = new Date(Date.UTC(y, m-1, d));
  if (dt.getUTCFullYear()!==y || dt.getUTCMonth()!==m-1 || dt.getUTCDate()!==d) return null;
  return {y, m, d};
}
const court = s => { const p=parseDate(s); return p ? String(p.d).padStart(2,"0")+"/"+String(p.m).padStart(2,"0") : ""; };
const full = s => { const p=parseDate(s); return p ? court(s)+"/"+p.y : ""; };
const longDate = s => { const p=parseDate(s); return p ? (p.d===1?"1er":p.d)+" "+MOISL[p.m-1]+" "+p.y : ""; };
const jour = s => { const p=parseDate(s); return p ? JOURS[new Date(Date.UTC(p.y,p.m-1,p.d)).getUTCDay()] : ""; };
function eur(v){
  if (!isNum(v)) return "—";
  const r = Math.round(v*100)/100;
  const parts = Math.abs(r).toFixed(2).split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (r<0?"-":"") + parts[0] + "," + parts[1] + " €";
}
function nb(v){
  if (!isNum(v)) return "—";
  const r = Math.round(v*100)/100;
  let [i,d] = Math.abs(r).toFixed(2).split(".");
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return (r<0?"-":"") + (d==="00" ? i : i+","+d.replace(/0$/,""));
}
function parseNumber(txt){
  if (txt === null || txt === undefined) return NaN;
  const t = String(txt).replace(/\s| | |€/g,"").replace(",",".");
  if (t === "") return NaN;
  if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
  return Number(t);
}
/* Mois comptés en N entre deux dates (mois touchés, bornés à N) */
function moisEn2027(debut, fin){
  const f = parseDate(fin); if (!f) return 0;
  if (f.y < YEAR) return 0;
  const d = parseDate(debut);
  const startM = (!d || d.y < YEAR) ? 1 : (d.y > YEAR ? 13 : d.m);
  const endM = f.y > YEAR ? 12 : f.m;
  return Math.max(0, endM - startM + 1);
}
/* mois de début de projection → nombre de mois jusqu'à décembre */
function moisRestants(dateStr){
  const d = parseDate(dateStr);
  if (!d || d.y !== YEAR) return 0;
  return 12 - d.m + 1;
}
function addMonthsLabel(dateStr, dureeMois){
  const d = parseDate(dateStr); if (!d || !(dureeMois>0)) return "";
  const idx = (d.m-1) + dureeMois - 1;
  return MOISC[idx%12] + " " + (d.y + Math.floor(idx/12));
}

/* ============ Listes déroulantes (modifiables ici si besoin) ============ */
const LISTES = {
  financeur: ["PRF REGION","REGION (hors prf)","ENTREPRISES","ETAT","INDIVIDUELS","MISE A DISPO"],
  marcheGip: ["OUI PRF","OUI hors prf","NON","portage gip"],
  niveau: ["3 (ex V)","4 (ex IV)","5 (ex III)","6 (ex II)","7 (ex I)"],
  domaine: ["Automobile Peinture","Automobile Carrosserie","Automobile (hors peinture/carrosserie)","Transport (conduite)","Logistique","Travail des métaux","Pôle 5 Autre"],
  integration: ["NON","en F.I.","en UFA","en F.C."]
};


/* ============ État ============ */
const KEY = "planning-ca-vierge-v1";
let state;
let site = "";
let view = "intro";
let affichage = "minore";
let storageOK = true;

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const data = JSON.parse(raw);
      if (valideStructure(data)) state = migrer(normalise(data));
    }
    const ui = JSON.parse(localStorage.getItem(KEY+"-ui") || "{}");
    if (ui.site && state.sites[ui.site]) site = ui.site;
    if (["intro","ca","qf","edit","global"].includes(ui.view)) view = ui.view;
    if (ui.v === 5 && ["brut","minore"].includes(ui.affichage)) affichage = ui.affichage;
  } catch(e){ storageOK = false; }
}
function save(){
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    localStorage.setItem(KEY+"-ui", JSON.stringify({v:5, site, view, affichage}));
    setStatus("Enregistré automatiquement", true);
  } catch(e){
    storageOK = false;
    setStatus("Enregistrement automatique indisponible : pensez à « Enregistrer une copie »", false);
  }
}
function valideStructure(d){
  return d && typeof d === "object" && d.sites && typeof d.sites === "object" && !Array.isArray(d.sites) &&
    Object.values(d.sites).every(s => s && Array.isArray(s.actions) && Array.isArray(s.apprentissage));
}
function str(v, def){ return typeof v === "string" ? v : def; }
function numOr(v, def){ return isNum(v) ? v : def; }
function numOrNull(v){ return isNum(v) ? v : null; }

/* Complète les champs manquants pour éviter toute erreur de calcul */
function normPeriode(p){ p = p && typeof p === "object" ? p : {}; return {eff:numOrNull(p.eff), heures:numOrNull(p.heures), tarif:numOrNull(p.tarif), forfait:numOrNull(p.forfait), caSaisi:numOrNull(p.caSaisi)}; }
function normCommun(o, cat){
  const ent = cat !== "actions";
  return {
    financeur: str(o.financeur, ent ? "ENTREPRISES" : "PRF REGION"),
    marcheGip: str(o.marcheGip, ent ? "NON" : "OUI PRF"),
    niveau: str(o.niveau, ""), domaine: str(o.domaine, ""), integration: str(o.integration, "NON"),
    absent: isNum(o.absent) ? o.absent : (ent ? 10 : 20),
    methode: ["matrice","bdc","dates"].includes(o.methode) && !((o.methode === "bdc" || o.methode === "dates") && cat === "apprentissage") ? o.methode : "auto",
    p1: normPeriode(o.p1), p2: normPeriode(o.p2), saisiPeriodes: !!o.saisiPeriodes,
    datesAPreciser: !!o.datesAPreciser, observations: str(o.observations, ""), src: str(o.src, ""), ref: str(o.ref, "")
  };
}
function normActionBase(a){
  return {nom: str(a.nom,"Nouvelle action"), lieu: str(a.lieu,""), bdc: str(a.bdc,""),
    montant: numOr(a.montant,0), debut: str(a.debut,""), fin: str(a.fin,""),
    mois2027: numOr(a.mois2027,0), duree: numOr(a.duree,0),
    relance: !!a.relance, dateRelance: str(a.dateRelance,`${YEAR}-09-01`), neutre: !!a.neutre,
    examDebut: str(a.examDebut,""), examFin: str(a.examFin,""), examLabel: str(a.examLabel,"Épreuves"), bilan: str(a.bilan,""),
    bdcStag: numOrNull(a.bdcStag), bdcPrix: numOrNull(a.bdcPrix), bdcHeures: numOrNull(a.bdcHeures), h1: numOrNull(a.h1), h2: numOrNull(a.h2),
    hEnt: numOrNull(a.hEnt), planC: plan12(a.planC), planE: plan12(a.planE), y26: normY26(a.y26), r27: normR27(a.r27)};
}
function plan12(v){ const a = Array.isArray(v) ? v : []; return Array.from({length:12}, (_,i) => numOrNull(a[i])); }
function normApprBase(f){
  return {nom: str(f.nom,"Nouvelle formation"), code: str(f.code,""), debut: str(f.debut,""), fin: str(f.fin,""),
    bdcHeures: numOrNull(f.bdcHeures), hEnt: numOrNull(f.hEnt), planC: plan12(f.planC), planE: plan12(f.planE), y26: normY26(f.y26),
    ap26: normZoneAppr(f.ap26, {actif:true, mode: Array.isArray(f.apprentis) && f.apprentis.length ? "liste" : "global", debut: str(f.debut,""), fin: str(f.fin,"")}),
    ap27: normZoneAppr(f.ap27, {actif: isNum(f.projNb) && f.projNb > 0, mode:"global", debut: str(f.projDate,`${YEAR}-09-01`), fin:"", nb: isNum(f.projNb) && f.projNb > 0 ? f.projNb : null, pec: isNum(f.projPec) ? f.projPec : null}),
    examDebut: str(f.examDebut,""), examFin: str(f.examFin,""), examLabel: str(f.examLabel,""),
    projNb: numOr(f.projNb,0), projPec: isNum(f.projPec) ? f.projPec : null, projDate: str(f.projDate,`${YEAR}-09-01`),
    apprentis: Array.isArray(f.apprentis) ? f.apprentis.map(p => ({
      nom: str(p && p.nom,""), contrat: str(p && p.contrat,""), debut: str(p && p.debut,""), fin: str(p && p.fin,""), pec: p && isNum(p.pec) ? p.pec : null
    })) : []};
}
/* Méthode « bon de commande » : les heures sont saisies par période (comme la matrice) */
function migrerBDC(o){
  if (o.methode !== "bdc") return o;
  if (!isNum(o.h1) && !isNum(o.h2)) return o; /* reprise unique des anciennes données (h1/h2) : jamais de préremplissage caché ensuite */
  const vide = p => !isNum(p.eff) && !isNum(p.heures) && !isNum(p.tarif);
  if (vide(o.p1) && (isNum(o.bdcStag) || isNum(o.h1))) o.p1 = normPeriode({eff:o.bdcStag, heures:o.h1, tarif:o.bdcPrix});
  if (vide(o.p2) && isNum(o.h2) && o.relance !== false) o.p2 = normPeriode({eff:o.bdcStag, heures:o.h2, tarif:o.bdcPrix});
  o.h1 = null; o.h2 = null;
  return o;
}
function normAction(a){ return migrerBDC(Object.assign(normActionBase(a), normCommun(a, "actions"))); }
function normAppr(f){ const o = Object.assign(normApprBase(f), normCommun(f, "apprentissage")); o.ap27.mode = "global"; return o; }
function normFP(f){
  const a = normActionBase(f), p = normApprBase(f);
  return migrerBDC(Object.assign({}, a, {code: p.code, projNb: p.projNb, projPec: p.projPec, projDate: p.projDate, apprentis: p.apprentis, ap26: p.ap26, ap27: p.ap27,
    nom: str(f.nom,"Nouvelle formation fonds privés"), mode: f.mode === "stagiaire" ? "stagiaire" : "global"}, normCommun(f, "fp")));
}
/* ============ Fonds privés individuels ============ */
const FINANCEMENTS = ["CPF","Autofinancement (particulier)","Employeur (plan de développement des compétences)","OPCO","France Travail (AIF)","Transition Pro (PTP)","Région / collectivité","Autre"];
function normStagFPI(x){
  x = x && typeof x === "object" ? x : {};
  return {nom: str(x.nom,""), financement: str(x.financement,""), dossier: str(x.dossier,""), debut: str(x.debut,""), fin: str(x.fin,""), montant: numOrNull(x.montant)};
}
function normFPI(f){
  f = f && typeof f === "object" ? f : {};
  return {nom: str(f.nom,"Nouvelle formation fonds privés individuels"), lieu: str(f.lieu,""), financeur: str(f.financeur,"INDIVIDUELS"),
    niveau: str(f.niveau,""), domaine: str(f.domaine,""), absent: isNum(f.absent) ? f.absent : 0, observations: str(f.observations,""),
    stagiaires: Array.isArray(f.stagiaires) ? f.stagiaires.map(normStagFPI) : [],
    stagiaires27: Array.isArray(f.stagiaires27) ? f.stagiaires27.map(normStagFPI) : []};
}
function caStagFPI(x){ const mc = moisComptes(x.debut, x.fin); if (!mc || !isNum(x.montant)) return {ca:0, mc, ok:false}; return {ca: x.montant * mc.an / mc.total, mc, ok:true}; }
function calcFPI(o){
  let cur = 0, prev = 0, manquants = 0;
  o.stagiaires.forEach(x => { const r = caStagFPI(x); if (r.ok) cur += r.ca; else if (x.nom || isNum(x.montant)) manquants++; });
  o.stagiaires27.forEach(x => { const r = caStagFPI(x); if (r.ok) prev += r.ca; else if (x.nom || isNum(x.montant)) manquants++; });
  return {cur, prev, tot: cur + prev, ok: true, manquants, nbp: o.stagiaires27.length};
}
function sansInfoFPI(o){ return ![...o.stagiaires, ...o.stagiaires27].some(x => isNum(x.montant) && x.montant > 0); }
function financementsTxt(o){
  const T = {}; [...o.stagiaires, ...o.stagiaires27].forEach(x => { const k = x.financement || "financement ?"; T[k] = (T[k]||0) + 1; });
  return Object.entries(T).map(([k,n]) => `${k.split(" (")[0]} ${n}`).join(" · ");
}
function siteVide(){ return {notesHors:"", actions:[], apprentissage:[], fondsPrives:[], fondsPrivesInd:[]}; }
function nouvelId(){ return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function normalise(d){
  /* l'année doit être connue avant de compléter les champs (dates par défaut) */
  if (isNum(d.annee)) setAnnee(d.annee);
  const out = {version:6, annee: YEAR, organisme: str(d.organisme, ""), etabs: [], sites:{}};
  const src = d.sites && typeof d.sites === "object" ? d.sites : {};
  /* liste des établissements : celle enregistrée, sinon reconstituée depuis une ancienne copie (un établissement par site) */
  let etabs = Array.isArray(d.etabs) ? d.etabs : Object.keys(src).map(k => ({id:k, nom:k}));
  const vus = new Set();
  etabs.forEach(e => {
    if (!e || typeof e !== "object") return;
    let id = str(e.id, "") || nouvelId();
    while (vus.has(id)) id = nouvelId();
    vus.add(id);
    out.etabs.push({id, nom: str(e.nom, "")});
    const s = src[e.id] && typeof src[e.id] === "object" ? src[e.id] : siteVide();
    out.sites[id] = {
      notesHors: typeof s.notesHors === "string" ? s.notesHors : "",
      actions: Array.isArray(s.actions) ? s.actions.map(normAction) : [],
      apprentissage: Array.isArray(s.apprentissage) ? s.apprentissage.map(normAppr) : [],
      fondsPrives: Array.isArray(s.fondsPrives) ? s.fondsPrives.map(normFP) : [],
      fondsPrivesInd: Array.isArray(s.fondsPrivesInd) ? s.fondsPrivesInd.map(normFPI) : []
    };
  });
  return out;
}
/* Libellés des établissements */
function nomEtab(id){ const e = state && state.etabs.find(x => x.id === id); return e ? (e.nom.trim() || "Établissement sans nom") : ""; }
function eyebrow(id){ return [state.organisme.trim(), nomEtab(id), "Année " + YEAR].filter(Boolean).join(" · "); }
function migrer(st){ return st; }
function donneesOrigine(){ return normalise({annee: YEAR, organisme: "", etabs: [], sites: {}}); }
function finDeMois(debut, nbMois){ const d = parseDate(debut); if (!d || !(nbMois > 0)) return ""; const idx = d.y*12 + d.m - 1 + nbMois - 1; const y = Math.floor(idx/12), m = idx%12 + 1; return `${y}-${String(m).padStart(2,"0")}-${String(joursMois(y,m)).padStart(2,"0")}`; }

/* ============ Calculs ============ */
function calcAction(a){
  const duree = isNum(a.duree) && a.duree > 0 ? a.duree : 0;
  const montant = isNum(a.montant) ? a.montant : 0;
  const mois = isNum(a.mois2027) && a.mois2027 >= 0 ? a.mois2027 : 0;
  const mr = a.relance ? moisRestants(a.dateRelance) : 0;
  if (a.neutre) return {cur:0, prev:0, tot:0, mr, ok:true};
  if (!duree) return {cur:0, prev:0, tot:0, mr, ok:false, pb:"durée manquante"};
  const cur = montant * Math.min(mois, duree) / duree; /* jamais plus que le montant du bon de commande */
  const prev = a.relance ? montant * mr / duree : 0;
  return {cur, prev, tot:cur+prev, mr, ok:true};
}
function calcAppr(f){
  const z1 = f.ap26, z2 = f.ap27;
  let cur = 0, manquants = 0, prev = 0;
  if (z1.mode === "liste") { const r = caListe(f.apprentis); cur = r.t; manquants += r.manq; } else cur = caGlobal(z1);
  if (z2.actif) { if (z2.mode === "liste") { const r = caListe(z2.apprentis); prev = r.t; manquants += r.manq; } else if (f.mode === "stagiaire") prev = caGlobal(z2); else { const r = caRentreeMixte(z2); prev = r.t; manquants += r.manq; } }
  const vide2 = z2.mode === "global" && f.mode !== "stagiaire" ? (!globalOk(z2) && !z2.apprentis.length) : zoneVide(z2, z2.apprentis);
  const sansPec = zoneVide(z1, f.apprentis) && (!z2.actif || vide2);
  const nbp = z2.actif ? (z2.mode === "global" && f.mode !== "stagiaire" ? Math.max(isNum(z2.nb) ? z2.nb : 0, z2.apprentis.length) : effectifZone(z2, z2.apprentis)) : 0;
  return {cur, prev, tot:cur+prev, mr: moisGlobal(z2), nbp, pecOk: true, manquants, sansPec};
}
function calcBDC(o){
  const n = v => isNum(v) ? v : 0;
  const cur = n(o.bdcStag) * n(o.h1) * n(o.bdcPrix);
  const prev = o.relance ? n(o.bdcStag) * n(o.h2) * n(o.bdcPrix) : 0;
  return {cur, prev, tot:cur+prev, ok: n(o.bdcStag) > 0 && n(o.bdcPrix) > 0};
}
function caCalcule(p){ const n = v => isNum(v) ? v : 0; return n(p.forfait) + n(p.eff) * n(p.heures) * n(p.tarif); }
function caPeriode(p){ return isNum(p.caSaisi) ? p.caSaisi : caCalcule(p); }
/* Heures BDC : stagiaires × heures × prix uniquement (forfait et CA saisi sont propres à la matrice et ignorés, sans être effacés) */
function caHeures(p){ const n = v => isNum(v) ? v : 0; return n(p.eff) * n(p.heures) * n(p.tarif); }
function caPer(o, key){ return o.methode === "bdc" ? caHeures(o[key]) : caPeriode(o[key]); }
function calcMatrice(o){ const cur = caPer(o, "p1"), prev = caPer(o, "p2"); return {cur, prev, tot:cur+prev, ok:true}; }
/* Actions et fonds privés : pas d'information du bon de commande (parcours, heures centre, prix ou montant) = pas de CA */
function soumisAuBDC(o, cat){ return cat === "actions" || (cat === "fp" && !(o.methode === "auto" && o.mode === "stagiaire")); }
function sansInfo(o, cat){
  if (cat === "fpi") return sansInfoFPI(o);
  if (!soumisAuBDC(o, cat)) return false;
  if (o.methode === "dates") return sessionEnCours(o).montant === null && !(o.r27 && o.r27.actif && sessionRentree(o).montant !== null);
  /* périodes janv.-août / sept.-déc. saisies par l'utilisateur : elles comptent même sans bon de commande */
  if ((o.methode === "matrice" || o.methode === "bdc") && o.saisiPeriodes && (periodeActive(o.p1, o) || periodeActive(o.p2, o))) return false;
  const complet = isNum(o.bdcStag) && isNum(o.bdcHeures) && isNum(o.bdcPrix);
  return !complet && !(isNum(o.montant) && o.montant > 0);
}
/* CA brut d'une ligne, quelle que soit la catégorie */
function calcBrut(o, cat){
  if (cat === "fpi") return sansInfoFPI(o) ? {cur:0, prev:0, tot:0, ok:true, vide:true} : calcFPI(o);

/* ============ Rendu : CA global (tous les établissements) ============ */
const TYPES_G = [["actions","Actions"],["apprentissage","Apprentissage"],["fp","Fonds privés"],["fpi","Fonds privés individuels"]];
function totauxSite(S){
  const T = {}; TYPES_G.forEach(([c]) => T[c] = {deb:0, fin:0, brut:0, n:0});
  const lignesG = [];
  lignes(S).forEach(({o, cat}) => {
    const neutre = estNeutre(o, cat), c = calcBrut(o, cat), k = coefMinore(o);
    const l = {o, cat, deb: c.cur*k, fin: c.tot*k, brut: c.tot, neutre};
    lignesG.push(l);
    if (neutre) return;
    const t = T[cat]; t.deb += l.deb; t.fin += l.fin; t.brut += l.brut; t.n++;
  });
  const tot = {deb:0, fin:0, brut:0, n:0};
  Object.values(T).forEach(t => { tot.deb += t.deb; tot.fin += t.fin; tot.brut += t.brut; tot.n += t.n; });
  return {T, tot, lignes: lignesG};
}
function renderGlobal(){
  const el = document.getElementById("view-global"); if (!el) return;
  const sites = state.etabs.map(e => e.id), R = {};
  if (!sites.length) { el.innerHTML = `<div class="sheet"><h1>CA global ${YEAR}</h1><p class="lead">Aucun établissement : ajoutez-en dans la page « Accueil ».</p></div>`; return; }
  sites.forEach(s => R[s] = totauxSite(state.sites[s]));
  const G = {deb:0, fin:0, brut:0};
  sites.forEach(s => { G.deb += R[s].tot.deb; G.fin += R[s].tot.fin; G.brut += R[s].tot.brut; });
  const nomS = s => esc(nomEtab(s));
  const cell = (t, cls) => `<td class="${cls||""}">${eur(t.fin)}<span class="gsub">début ${eur(t.deb)}</span></td>`;
  const catListe = c => CATS[Object.keys(CATS).find(k => CATS[k].cat === c)].list;
  const types = TYPES_G.filter(([c]) => sites.some(s => R[s].T[c].n || state.sites[s][catListe(c)].length));
  const rowsType = types.map(([c, lib]) => {
    const g = {deb:0, fin:0}; sites.forEach(s => { g.deb += R[s].T[c].deb; g.fin += R[s].T[c].fin; });
    return `<tr><td>${lib}</td>${sites.map(s => cell(R[s].T[c])).join("")}${cell(g, "gl")}</tr>`;
  }).join("");
  const partSite = s => G.fin ? Math.round(R[s].tot.fin / G.fin * 100) : 0;
  const entetes = sites.map(s => `<th>${nomS(s)}</th>`).join("");
  /* répartitions cumulées */
  const repG = (champ, titre) => {

    sites.forEach(s => R[s].lignes.forEach(l => { if (l.neutre) return; const cle = l.o[champ] || "Non renseigné"; M[cle] = M[cle] || {}; M[cle][s] = (M[cle][s] || 0) + l.fin; }));

  };
  const libCat = Object.fromEntries(TYPES_G);
  const detail = sites.map(s => R[s].lignes.map(l => `<tr><td>${esc(l.o.nom)}<span class="gsub">${nomS(s)} · ${libCat[l.cat]}</span></td>
      ${l.neutre ? `<td class="neu" colspan="3">ligne neutre · hors totaux</td>` : `<td>${eur(l.deb)}</td><td><b>${eur(l.fin)}</b></td><td>${eur(l.brut)}</td>`}</tr>`).join("")).join("");
  const listeNoms = sites.map(nomEtab).join(" + ");
  el.innerHTML = `
  <div class="sheet print-page">
    <div class="eyebrow">${esc([state.organisme.trim(), listeNoms, `Année ${YEAR}`].filter(Boolean).join(" · "))}</div>

    <p class="lead">Montants avec l'absentéisme prévu déduit (brut indiqué à part). Les lignes neutres sont hors totaux. Mis à jour automatiquement à chaque modification.</p>
    <div class="g-kpis">
      <div class="kpi tot"><span>CA fin ${YEAR} global · avec absentéisme</span><b>${eur(G.fin)}</b><small>brut ${eur(G.brut)}</small></div>
      <div class="kpi"><span>CA début ${YEAR} (existant)</span><b>${eur(G.deb)}</b><small>prévisionnel : ${eur(G.fin - G.deb)}</small></div>
      ${sites.map(s => `<div class="kpi"><span>${nomS(s)}</span><b>${eur(R[s].tot.fin)}</b><small>${partSite(s)} % du global · brut ${eur(R[s].tot.brut)}</small></div>`).join("")}
    </div>
    <h2 class="g-h2">Par type de formation</h2>
    <div class="scroll"><table class="gt"><thead><tr><th>Type</th>${entetes}<th class="gl">Global</th></tr></thead><tbody>

      <tr class="tot"><td>Total</td>${sites.map(s => cell(R[s].tot)).join("")}${cell(G, "gl")}</tr>

  </div>`;
}

function renderQF(){
  const S = state.sites[site];
  if (!S) { vueSansEtab("view-qf"); return; }
  const G = {};
  const push = (d, item) => { const o = item.a || item.f; if (o && o.datesAPreciser) return; const p=parseDate(d); if (p && p.y===YEAR) (G[d]=G[d]||[]).push(item); };
  S.actions.filter(a=>!a.neutre).forEach(a => push(a.fin, {k:"s", c:"var(--ses)", nom:a.nom, code:a.lieu, a}));
  const addPeople = (f, c, code) => { const by = {}; f.apprentis.forEach(p => { (by[p.fin]=by[p.fin]||[]).push(p); }); Object.entries(by).forEach(([d, ps]) => push(d, {k:"a", c, nom:f.nom, code, ps})); };
  S.apprentissage.forEach(f => {
    if (f.methode === "auto") {
      if (f.ap26.mode === "global" && globalOk(f.ap26)) push(f.ap26.fin, {k:"t", c:"var(--app)", nom:f.nom, code:f.code + " · " + nb(f.ap26.nb) + " apprentis (prévision)", f});
      else if (f.ap26.mode === "liste") addPeople(f, "var(--app)", f.code);
      if (f.ap27.actif && f.ap27.apprentis.length) addPeople({nom:f.nom, apprentis:f.ap27.apprentis}, "var(--app)", f.code + ` · rentrée ${YEAR}`);
    } else {
      if (!f.apprentis.length) push(f.fin, {k:"t", c:"var(--app)", nom:f.nom, code:f.code, f});
      addPeople(f, "var(--app)", f.code);
    }
  });
  S.fondsPrives.forEach(f => {
    const code = [f.code || f.lieu, "fonds privés"].filter(Boolean).join(" · ");
    if (parZones(f, "fp")) {
      if (!f.apprentis.length) push(f.fin, {k:"t", c:"var(--fp)", nom:f.nom, code, f});
      if (f.ap27 && f.ap27.actif && f.ap27.apprentis.length) addPeople({nom:f.nom, apprentis:f.ap27.apprentis}, "var(--fp)", code + ` · rentrée ${YEAR}`);
    }
    else if (!f.neutre) push(f.fin, {k:"s", c:"var(--fp)", nom:f.nom, code, a:f});
    addPeople(f, "var(--fp)", code);
  });
  S.fondsPrivesInd.forEach(f => {
    const code = [f.lieu, "fonds privés individuels"].filter(Boolean).join(" · ");
    const conv = x => ({nom: x.nom || "(sans nom)", contrat: x.financement || "financement ?", fin: x.fin});
    addPeople({nom: f.nom, apprentis: f.stagiaires.map(conv)}, "var(--fpi)", code);
    addPeople({nom: f.nom, apprentis: f.stagiaires27.map(conv)}, "var(--fpi)", code + ` · rentrée ${YEAR}`);
  });
  let body = "";
  Object.keys(G).sort().forEach(d => {
    const items = G[d];
    const n = items.reduce((t,x)=>t+(x.ps?x.ps.length:0),0);
    items.forEach((x,i) => {
      let det = "";
      if (x.k==="s") {
        const parts=[]; if (parseDate(x.a.examDebut)) parts.push(`${esc(x.a.examLabel||"Épreuves")} du ${court(x.a.examDebut)} au ${court(x.a.examFin)}`);
        if (parseDate(x.a.bilan)) parts.push("bilan le "+court(x.a.bilan));
        det = `<div class="tiny"><i>Fin de session</i></div>${parts.length?`<div>${parts.join(" · ")}</div>`:""}`;
      } else if (x.k==="t") {
        det = `<div class="tiny"><i>Fin de session</i></div>${parseDate(x.f.examDebut)?`<div>${esc(x.f.examLabel||"Épreuves")} les ${court(x.f.examDebut)} et ${court(x.f.examFin)}</div>`:""}`;
      } else {
        det = x.ps.map(p=>`<span class="chip">${esc(p.nom)}<small>${esc(p.contrat)}</small></span>`).join("");
      }
      body += `<tr class="${i===0?"first":""}">
        <td style="width:15%">${i===0?`<div class="qd">${longDate(d)}</div><div class="tiny">${jour(d)}</div>${n?`<div class="tiny"><b>${n} personne${n>1?"s":""}</b></div>`:""}`:""}</td>
        <td style="width:28%"><span class="dot" style="background:${x.c}"></span><b>${esc(x.nom)}</b><div class="tiny" style="margin-left:15px">${esc(x.code)}</div></td>
        <td>${det}</td></tr>`;
    });
  });
  if (!body) body = `<tr><td colspan="3" class="tiny">Aucune fin en ${YEAR}.</td></tr>`;

  const apres = [], avant = [];
  /* personnes d'une même formation avec la même date de fin : regroupées sur une ligne */
  const peopleHors = f => {
    const grp = {};
    f.apprentis.forEach(ap => { const q=parseDate(ap.fin); if (!q || q.y === YEAR) return; (grp[ap.fin] = grp[ap.fin] || {q, noms:[]}).noms.push(esc(ap.nom)); });
    Object.keys(grp).sort().forEach(d => { const g = grp[d]; const t = `${g.noms.join(", ")} · ${esc(f.nom)} · fin le ${full(d)}`; (g.q.y > YEAR ? apres : avant).push(t); });
  };
  S.actions.forEach(a => { const p=parseDate(a.fin); if (p && p.y>YEAR) apres.push(`${esc(a.nom)} · fin le ${full(a.fin)}`); });
  S.apprentissage.forEach(f => {
    const p = parseDate(f.fin);
    if (!f.apprentis.length && p && p.y>YEAR) apres.push(`${esc(f.nom)} · ${esc(f.code)}${parseDate(f.examDebut)?` · ${esc(f.examLabel||"Épreuves")} les ${court(f.examDebut)} et ${full(f.examFin)}`:` · fin le ${full(f.fin)}`}`);
    peopleHors(f);
    if (f.ap27 && f.ap27.actif && f.ap27.apprentis.length) peopleHors({nom: f.nom + ` (rentrée ${YEAR})`, apprentis: f.ap27.apprentis});
  });
  S.fondsPrives.forEach(f => { const p=parseDate(f.fin); if (p && p.y>YEAR && (f.mode!=="stagiaire" || !f.apprentis.length)) apres.push(`${esc(f.nom)} (fonds privés) · fin le ${full(f.fin)}`); peopleHors(f); });
  S.fondsPrivesInd.forEach(f => peopleHors({nom: f.nom + " (fonds privés individuels)", apprentis: [...f.stagiaires, ...f.stagiaires27].map(x => ({nom: x.nom || "(sans nom)", fin: x.fin}))}));
  const aPreciser = lignes(S).filter(({o}) => o.datesAPreciser).map(({o, cat}) => `${esc(o.nom)} · ${cat==="actions"?"action":cat==="fp"?"fonds privés":"apprentissage"}${o.observations?" · "+esc(o.observations):""}`);
  const notes = (S.notesHors||"").split("\n").map(t=>t.trim()).filter(Boolean).map(esc);
  const avantAll = [...avant, ...notes];
  const hors = (apres.length||avantAll.length) ? `
    <h2 style="margin-top:22px">Hors ${YEAR}</h2>
    ${apres.length?`<div class="tiny"><b>Fins après ${YEAR}</b></div><ul class="hors">${apres.map(t=>`<li>${t}</li>`).join("")}</ul>`:""}
    ${avantAll.length?`<div class="tiny" style="margin-top:8px"><b>Fins avant ${YEAR} et remarques</b></div><ul class="hors">${avantAll.map(t=>`<li>${t}</li>`).join("")}</ul>`:""}` : "";
  const preciser = aPreciser.length ? `<h2 style="margin-top:22px">Dates à préciser</h2><div class="tiny">Lignes cochées « Dates à préciser », sans dates de début et de fin : elles n'apparaissent pas dans la liste ci-dessus.</div><ul class="hors">${aPreciser.map(t=>`<li>${t}</li>`).join("")}</ul>` : "";

  document.getElementById("view-qf").innerHTML = `
  <div class="sheet print-page">
    <div class="eyebrow">${esc(eyebrow(site))}</div>
    <h1>Qui finit quand — fins ${YEAR} ${esc(nomEtab(site))}</h1>
    <p class="lead">Regroupé par date de fin commune, puis par formation.</p>
    <table class="qf"><thead><tr><th>Date de fin</th><th>Formation</th><th>Personnes / détails</th></tr></thead><tbody>${body}</tbody></table>
    ${hors}
    ${preciser}
  </div>`;
}

/* ============ Rendu : édition ============ */
function fld(label, path, value, opt={}){
  const id = "f-"+path.replace(/\./g,"-") + (opt.idSuffix ? "-"+opt.idSuffix : "");
  const type = opt.type || "text";
  let input;
  if (type==="checkbox") return `<label class="chk"><input type="checkbox" id="${id}" data-path="${path}" data-type="bool" ${value?"checked":""}> ${label}</label>`;
  if (type==="select") {
    let options = opt.options.slice();
    if (opt.blank) options.unshift(["", "—"]);
    if (value && !options.some(([v]) => v === value)) options.push([value, value]);
    input = `<select id="${id}" data-path="${path}" data-type="${opt.rerender?"select":"selectq"}">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?"selected":""}>${esc(t)}</option>`).join("")}</select>`;
  }
  else if (type==="date") input = `<input type="date" id="${id}" data-path="${path}" data-type="date" value="${esc(value)}">`;
  else if (type==="number") input = `<input type="text" inputmode="decimal" id="${id}" data-path="${path}" data-type="number" ${opt.optional?'data-optional="1"':""} value="${isNum(value)?esc(String(value).replace(".",",")):""}" placeholder="${opt.optional?(opt.placeholder||"non communiqué"):""}">`;
  else if (type==="textarea") input = `<textarea id="${id}" data-path="${path}" data-type="text" rows="${opt.rows||4}">${esc(value)}</textarea>`;
  else input = `<input type="text" id="${id}" data-path="${path}" data-type="text" value="${esc(value)}">`;
  return `<div class="f ${opt.wide?"wide":""} ${opt.wide2?"wide2":""}"><label for="${id}">${label}</label>${input}${opt.hint?`<div class="hint" id="${id}-hint">${opt.hint}</div>`:""}<div class="msg" id="${id}-msg"></div></div>`;
}
const opts = arr => arr.map(v => [v, v]);
const CATS = {a:{list:"actions", cat:"actions", titre:"Action"}, p:{list:"apprentissage", cat:"apprentissage", titre:"Apprentissage"}, f:{list:"fondsPrives", cat:"fp", titre:"Fonds privés"}, i:{list:"fondsPrivesInd", cat:"fpi", titre:"Fonds privés individuels"}};
let sel = "a0";
function selObjet(){
  const S = state.sites[site];
  if (sel === "notes") return {key:"notes"};
  const c = CATS[sel[0]]; const i = Number(sel.slice(1));
  if (!c || !S[c.list][i]) return null;
  return {key:sel, o:S[c.list][i], cat:c.cat, list:c.list, i, p:`${c.list}.${i}`, kind:sel[0]};
}
function validerSel(){
  if (selObjet()) return;
  const S = state.sites[site];
  sel = S.actions.length ? "a0" : S.apprentissage.length ? "p0" : S.fondsPrives.length ? "f0" : S.fondsPrivesInd.length ? "i0" : "notes";
}

/* Résumés */
function resumeCarte(o, cat){
  if (sansInfo(o, cat)) return "pas de CA";
  if (cat === "fpi") return eur(calcFPI(o).tot * coef(o));
  const c = calcBrut(o, cat), k = coef(o);
  if (estNeutre(o, cat)) return (o.methode === "matrice" || o.methode === "bdc") ? eur(calcMatrice(o).tot) + " (neutre)" : eur(o.methode === "dates" ? sessionEnCours(o).montant : o.montant) + " (neutre)";
  if (o.methode !== "matrice" && (cat === "apprentissage" || (cat === "fp" && o.mode === "stagiaire")) && c.sansPec) return cat === "fp" ? "Prix non communiqué" : "PEC non communiquée";
  return eur(c.tot * k);
}
function sousTitre(o, cat){
  if (cat === "fpi") { const n = o.stagiaires.length + o.stagiaires27.length; return [o.lieu, `${n} stagiaire${n>1?"s":""}`, o.stagiaires27.length ? `rentrée ${YEAR}` : ""].filter(Boolean).join(" · "); }
  const m = o.methode === "matrice" ? "matrice" : (o.methode === "bdc" ? "heures BDC" : (o.methode === "dates" ? (o.r27 && o.r27.actif ? `rentrée ${YEAR}` : "") : ""));
  if (cat === "actions") return [o.lieu, "fin " + (o.datesAPreciser ? "à préciser" : (full(o.fin)||"?")), o.neutre ? "neutre" : "", m].filter(Boolean).join(" · ");
  const n = o.apprentis.length;
  if (cat === "apprentissage") return [o.code, `${n} apprenti${n>1?"s":""}`, m].filter(Boolean).join(" · ");
  return [o.methode === "matrice" ? "matrice" : o.methode === "bdc" ? "heures" : o.methode === "dates" ? "dates et montant" : (o.mode !== "stagiaire" ? "montant global" : "par stagiaire"), `${n} stagiaire${n>1?"s":""}`].join(" · ");
}
function previewHTML(o, cat){

    <thead><tr><th style="text-align:left">Formation</th><th class="num">Début ${YEAR}</th>${MOIS.map(m=>`<th class="m">${m}</th>`).join("")}<th class="num">Fin ${YEAR}</th></tr></thead>
    <tbody>${rowFor(o, cat)}</tbody></table></div>`;
}

function ecartTxt(o){

    if (w) {
      const hors = o[arr].map((x,m) => (isNum(x) && x > 0 && (m < w.m0 || m > w.m1)) ? MOIS[m] : null).filter(Boolean);
      if (hors.length) out.push(`${lib} : des heures sont placées hors de la période de formation (${hors.join(", ")})`);
    }
    if (isNum(total) && somme12 > total + 0.5) out.push(`${lib} : le planning ${YEAR} (${nb(somme12)} h) dépasse les heures du parcours (${nb(total)} h)`);
  });

}

/* ============ Année N-1 ============ */
function moisEnAnnee(debut, fin, an){
  const f = parseDate(fin); if (!f || f.y < an) return 0;
  const d = parseDate(debut);
  const startM = (!d || d.y < an) ? 1 : (d.y > an ? 13 : d.m);
  const endM = f.y > an ? 12 : f.m;
  return Math.max(0, endM - startM + 1);
}
function normY26(y){
  y = y && typeof y === "object" ? y : {};
  return {planC: plan12(y.planC), planE: plan12(y.planE), eff: numOrNull(y.eff), heures: numOrNull(y.heures), tarif: numOrNull(y.tarif),
    forfait: numOrNull(y.forfait), caSaisi: numOrNull(y.caSaisi), mois: numOrNull(y.mois)};
}
/* CA brut N-1 d'une ligne */
function calc2026(o, cat){
  if (sansInfo(o, cat) || estNeutre(o, cat)) return {tot:0, vide: sansInfo(o, cat)};
  const y = o.y26;
  if (o.methode === "bdc" || o.methode === "matrice") return {tot: caPeriode(y)};
  const parPersonne = cat === "apprentissage" || (cat === "fp" && o.mode === "stagiaire");
  if (parPersonne) {
    let t = 0; o.apprentis.forEach(p => { const m = moisEnAnnee(p.debut, p.fin, Y26); if (m > 0 && isNum(p.pec)) t += p.pec * m / 12; });
    return {tot: t, parPersonne: true};
  }
  const duree = isNum(o.duree) && o.duree > 0 ? o.duree : 0;
  return {tot: duree && isNum(o.montant) && isNum(y.mois) ? o.montant * y.mois / duree : 0};
}
function sommeAn(arr){ return arr.reduce((t,x) => t + (isNum(x) ? x : 0), 0); }

/* ============ Sessions : session en cours + rentrée N (calcul automatique au prorata des mois) ============ */
/* Un mois est compté s'il contient au moins la moitié de ses jours en formation */
function joursMois(y, m){ return new Date(Date.UTC(y, m, 0)).getUTCDate(); } /* m = 1..12 */
function moisComptes(debut, fin){
  const d = parseDate(debut), f = parseDate(fin);
  if (!d || !f || fin < debut) return null;
  const res = {total:0, an:0, mois2027:[]};
  let y = d.y, m = d.m;
  const td = Date.UTC(d.y, d.m-1, d.d), tf = Date.UTC(f.y, f.m-1, f.d);
  while (y < f.y || (y === f.y && m <= f.m)) {
    const nbj = joursMois(y, m);
    const a = Math.max(td, Date.UTC(y, m-1, 1)), b = Math.min(tf, Date.UTC(y, m-1, nbj));
    const couverts = Math.round((b - a) / 864e5) + 1;
    if (couverts * 2 >= nbj) { res.total++; if (y === YEAR) { res.an++; res.mois2027.push(m-1); } }
    m++; if (m > 12) { m = 1; y++; }
  }
  if (res.total === 0) { res.total = 1; if (d.y === YEAR || f.y === YEAR) { res.an = 1; res.mois2027.push((f.y === YEAR ? f.m : d.m) - 1); } }
  return res;
}
function normR27(r){
  r = r && typeof r === "object" ? r : {};
  return {actif: !!r.actif, debut: str(r.debut, `${YEAR}-09-01`), fin: str(r.fin, ""), stag: numOrNull(r.stag), heures: numOrNull(r.heures),
    hEnt: numOrNull(r.hEnt), prix: numOrNull(r.prix), montant: numOrNull(r.montant)};
}
function montantSession(stag, heures, prix, manuel){
  if (isNum(stag) && isNum(heures) && isNum(prix)) return {v: Math.round(stag * heures * prix * 100) / 100, calc:true};
  if (isNum(manuel) && manuel > 0) return {v: manuel, calc:false};
  return {v: null, calc:false};
}
function sessionEnCours(o){
  const m = montantSession(o.bdcStag, o.bdcHeures, o.bdcPrix, o.montant);
  const mc = moisComptes(o.debut, o.fin);
  const ca = m.v !== null && mc ? m.v * mc.an / mc.total : 0;
  return {montant: m.v, calc: m.calc, mc, ca};
}
function sessionRentree(o){
  const r = o.r27;
  if (!r.actif) return {actif:false, ca:0, montant:null, mc:null};
  const m = montantSession(r.stag, r.heures, r.prix, r.montant);
  const mc = moisComptes(r.debut, r.fin);
  const ca = m.v !== null && mc ? m.v * mc.an / mc.total : 0;
  return {actif:true, montant: m.v, calc: m.calc, mc, ca};
}
function calcDates(o){
  const a = sessionEnCours(o), b = sessionRentree(o);
  return {cur: a.ca, prev: b.ca, tot: a.ca + b.ca, ok: true, a, b};
}
function ratioTxt(mc){ return mc ? `${mc.an}/${mc.total} mois` : "dates à saisir"; }
function finLabel(dateStr){ const p = parseDate(dateStr); return p ? MOISC[p.m-1] + " " + p.y : ""; }

/* Ligne de la time line pour une action calculée par les dates */
function datesRow(o, col, cat){

  const moisA = new Set(a.mc ? a.mc.mois2027 : []);
  const moisB = new Set(b.actif && b.mc ? b.mc.mois2027 : []);
  const e = monthIdx(o.fin), bi = monthIdx(o.bilan), ex = monthIdx(o.examDebut);
  const rs = b.actif ? monthIdx(o.r27.debut) : null, rf = b.actif ? monthIdx(o.r27.fin) : null;

  });
  const brut = (v) => affichage === "minore" && coefMinore(o) < 1 ? `<div class="tiny num">brut ${eur(v)} − ${nb(o.absent)} % absentéisme</div>` : "";

    ? `<div class="big num">—</div><div class="tiny num">${b.actif ? `rentrée ${YEAR} : informations à saisir` : "non compté dans les totaux"}</div>`
    : neutre

    : `<div class="big num">${eur(c.tot*k)}</div>` + (b.actif
        ? (b.montant === null ? `<div class="warn tiny num">rentrée ${YEAR} : informations à saisir</div>` : `<div class="tiny num" style="color:var(--new)">dont rentrée ${YEAR} ${eur(c.prev*k)} (${eur(b.montant)} × ${ratioTxt(b.mc)})</div>`)
        : `<div class="tiny num">pas de rentrée ${YEAR} prévue</div>`) + brut(c.tot);
  const sub = esc([o.lieu, o.bdc ? (cat==="fp"?"Convention ":"BDC ") + o.bdc : "", a.montant !== null ? eur(a.montant) : ""].filter(Boolean).join(" · "));
  return `<tr class="${neutre && !rentreeOk?"neutral":""}"><td><div class="fname">${esc(o.nom)}</div><div class="fsub">${sub}</div><div class="fsub">${esc(classTxt(o))}</div></td>
    <td class="money">${left}</td>${cells}<td class="money">${right}</td></tr>`;

/* Zones de saisie identiques : session en cours et rentrée N */
function zoneSession(o, p, cat, quoi){
  const enCours = quoi === "cours";
  const q = enCours ? p : p + ".r27";
  const src = enCours ? {debut:o.debut, fin:o.fin, stag:o.bdcStag, heures:o.bdcHeures, hEnt:o.hEnt, prix:o.bdcPrix, montant:o.montant}
                      : {debut:o.r27.debut, fin:o.r27.fin, stag:o.r27.stag, heures:o.r27.heures, hEnt:o.r27.hEnt, prix:o.r27.prix, montant:o.r27.montant};
  const k = enCours ? {stag:"bdcStag", heures:"bdcHeures", hEnt:"hEnt", prix:"bdcPrix"} : {stag:"stag", heures:"heures", hEnt:"hEnt", prix:"prix"};
  const opt = {type:"number", optional:true, placeholder:"—", idSuffix:"z"};
  const s = enCours ? sessionEnCours(o) : sessionRentree(o);
  const actif = enCours || o.r27.actif;
  const ms = montantSession(src.stag, src.heures, src.prix, src.montant);
  const montantHTML = ms.calc
    ? `<div class="f"><label>Montant TTC (calculé)</label><div class="dur-v" id="z-${quoi}-montant">${eur(ms.v)}</div><div class="hint">parcours × heures centre × prix</div></div>`
    : fld("Montant TTC (€)", q+".montant", src.montant, {type:"number", optional:true, placeholder:"—", idSuffix:"z", hint:"à la main si parcours, heures ou prix manquent"});
  const res = `<div class="zres" id="z-${quoi}-res">${zoneResultat(o, quoi)}</div>`;
  return `<div class="zone ${enCours?"zc":"zr"} ${actif?"":"off"}">
    ${enCours ? "" : `<div class="chks" style="margin-bottom:6px">${fld(`Rentrée ${YEAR} prévue`, q+".actif", o.r27.actif, {type:"checkbox"})}</div>`}
    <div class="fields">
      ${fld("Date de début", q+".debut", src.debut, {type:"date", idSuffix:"z"})}
      ${fld("Date de fin", q+".fin", src.fin, {type:"date", idSuffix:"z"})}
      ${fld("Nombre de parcours", q+"."+k.stag, src.stag, opt)}
      ${fld("Nombre d'heures centre", q+"."+k.heures, src.heures, opt)}
      ${fld("Nombre d'heures entreprise", q+"."+k.hEnt, src.hEnt, opt)}
      ${fld("Prix unitaire du marché (€/h)", q+"."+k.prix, src.prix, opt)}
      ${montantHTML}
    </div>${res}</div>`;
}
function zoneResultat(o, quoi){
  const s = quoi === "cours" ? sessionEnCours(o) : sessionRentree(o);
  const kk = coefMinore(o);
  if (quoi !== "cours" && !o.r27.actif) return `<span class="tiny">Cochez « Rentrée ${YEAR} prévue » pour l'ajouter à la time line et au prévisionnel.</span>`;
  if (!s.mc) return `<span class="warn">Saisissez les dates de début et de fin (la fin doit être après le début).</span>`;
  if (s.montant === null) return `<span class="warn">Saisissez le nombre de parcours, les heures centre et le prix (ou un montant).</span>`;
  const moisTxt = s.mc.mois2027.length ? s.mc.mois2027.map(m => MOISC[m]).join(", ") : "aucun";
  if (quoi === "cours" && o.neutre) return `<b>${s.mc.an} mois en ${YEAR}</b> sur ${s.mc.total} mois de formation · montant ${eur(s.montant)} · <b>ligne neutre : session en cours non comptée dans les totaux</b>${o.r27 && o.r27.actif ? ` (la rentrée ${YEAR} est comptée)` : ""}`;
  return `<b>${s.mc.an} mois en ${YEAR}</b> sur ${s.mc.total} mois de formation (${moisTxt}) · CA ${YEAR} = ${eur(s.montant)} × ${s.mc.an}/${s.mc.total} = <b>${eur(s.ca)}</b> brut · <b>${eur(s.ca*kk)}</b> avec ${nb(o.absent)} % d'absentéisme
    <div class="tiny">Un mois est compté s'il contient au moins 15 jours de formation.</div>`;
}

/* ============ Apprentissage : promotion en cours + rentrée N (liste nominative ou prévision globale) ============ */
function normZoneAppr(z, def){
  z = z && typeof z === "object" ? z : def;
  return {actif: z.actif !== undefined ? !!z.actif : true, mode: z.mode === "global" ? "global" : "liste",
    debut: str(z.debut, ""), fin: str(z.fin, ""), nb: numOrNull(z.nb), pec: numOrNull(z.pec),
    apprentis: Array.isArray(z.apprentis) ? z.apprentis.map(p => ({nom: str(p && p.nom,""), contrat: str(p && p.contrat,""), debut: str(p && p.debut,""), fin: str(p && p.fin,""), pec: p && isNum(p.pec) ? p.pec : null})) : []};
}
function parZones(o, cat){ return o.methode === "auto" && (cat === "apprentissage" || (cat === "fp" && o.mode === "stagiaire")); }
function caListe(list){ let t = 0, manq = 0; list.forEach(p => { const m = moisEn2027(p.debut, p.fin); if (m > 0) { if (isNum(p.pec)) t += p.pec * m / 12; else manq++; } }); return {t, manq}; }
function moisGlobal(z){ return moisEn2027(z.debut, z.fin || `${YEAR}-12-31`); }
function globalOk(z){ return isNum(z.nb) && z.nb > 0 && isNum(z.pec); }
function caGlobal(z){ return globalOk(z) ? z.nb * z.pec * moisGlobal(z) / 12 : 0; }
/* Rentrée N apprentissage : inscrits nominatifs + places restantes de la prévision globale */
function placesRestantes(z){ return Math.max(0, (isNum(z.nb) ? z.nb : 0) - z.apprentis.length); }
function caRentreeMixte(z){
  if (!z.apprentis.length) return {t: caGlobal(z), manq: 0};
  const r = caListe(z.apprentis), reste = placesRestantes(z);
  return {t: r.t + (reste > 0 && isNum(z.pec) ? reste * z.pec * moisGlobal(z) / 12 : 0), manq: r.manq, ins: r.t, reste};
}
function zoneVide(z, liste){ return z.mode === "liste" ? liste.length === 0 : !globalOk(z); }
function effectifZone(z, liste){ return z.mode === "liste" ? liste.length : (isNum(z.nb) ? z.nb : 0); }

function apprRow2(f, col, mots){
  const c = calcAppr(f), k = coef(f), z1 = f.ap26, z2 = f.ap27;
  const byEnd = {};
  let shade = new Set(), txts = {}, cont = false;
  const add = (m, t) => { txts[m] = txts[m] ? txts[m] + "<br>" + t : t; };
  if (z1.mode === "liste") {
    f.apprentis.forEach(p => { const mi = monthIdx(p.fin); if (mi !== null && mi >= 0 && mi < 12) (byEnd[mi] = byEnd[mi] || []).push(p); if (mi === 12) cont = true; });
    const last = cont ? 11 : Math.max(-1, ...Object.keys(byEnd).map(Number));
    const debs = f.apprentis.map(p => monthIdx(p.debut)).filter(x => x !== null);
    const first = debs.length ? Math.max(0, Math.min(...debs)) : 0;
    for (let m = first; m <= last; m++) shade.add(m);
    Object.entries(byEnd).forEach(([m, ps]) => { const ds = [...new Set(ps.map(p => p.fin))].sort(); add(Number(m), ds.map(d => "■ " + court(d) + " (" + ps.filter(p => p.fin === d).length + ")").join("<br>")); });
  } else if (globalOk(z1) || z1.debut || z1.fin) {
    const d = monthIdx(z1.debut), e = monthIdx(z1.fin || `${YEAR}-12-31`);
    const a = d === null ? 0 : Math.max(0, d), b = e === null ? 11 : Math.min(11, e);
    for (let m = a; m <= b; m++) shade.add(m);
    if (a <= 11 && isNum(z1.nb)) add(a, nb(z1.nb) + " appr.");
    if (e !== null && e >= 0 && e < 12) add(e, "■ Fin " + court(z1.fin));
    if (e === 12) cont = true;
  }
  if (cont && !txts[11]) add(11, `→ ${YEAR+1}`);
  /* rentrée N */
  const blue = new Set(); let lab = null;
  if (z2.actif) {
    if (z2.mode === "liste" && z2.apprentis.length) {
      const debs = z2.apprentis.map(p => monthIdx(p.debut)).filter(x => x !== null && x < 12);
      const a = debs.length ? Math.max(0, Math.min(...debs)) : 8;
      for (let m = a; m <= 11; m++) blue.add(m); lab = [a, z2.apprentis.length + " appr."];
    } else if (z2.mode === "global" && (globalOk(z2) || (f.mode !== "stagiaire" && z2.apprentis.length))) {
      const d = monthIdx(z2.debut), e = monthIdx(z2.fin || `${YEAR}-12-31`);
      const a = d === null ? 8 : Math.max(0, d), b = e === null ? 11 : Math.min(11, e);
      for (let m = a; m <= b; m++) blue.add(m); lab = [a, nb(f.mode === "stagiaire" ? z2.nb : Math.max(isNum(z2.nb) ? z2.nb : 0, z2.apprentis.length)) + " stag."];
    }
  }
  const ex = monthIdx(f.examDebut);
  const cells = cellsFor(m => {
    let cls = shade.has(m) ? col.cls : "", txt = txts[m] || "";
    if (ex === m && !txt && f.examLabel) txt = esc(f.examLabel) + " " + court(f.examDebut);
    if (blue.has(m)) { cls = "nw"; txt = lab && lab[0] === m ? lab[1] : (txt && shade.has(m) ? txt : ""); }
    return {cls, txt};
  });
  let left, right;
  const lblP = mots.prixCourt;
  if (c.sansPec) {
    left = `<div class="tiny num">aucun apprenti ni prévision saisis</div>`;
    right = `<div class="tiny num">pas de CA généré</div>`;
  } else {
    const d1 = z1.mode === "liste" ? `${f.apprentis.length} ${mots.contrat}${f.apprentis.length>1?"s":""} · ${lblP} × mois/12` : (globalOk(z1) ? `${nb(z1.nb)} × ${nb(z1.pec)} € × ${moisGlobal(z1)}/12` : "promo en cours non renseignée");
    const d2 = !z2.actif ? `pas de rentrée ${YEAR} prévue` : (z2.mode === "liste" ? `${z2.apprentis.length} ${mots.contrat}${z2.apprentis.length>1?"s":""} nommés` : (f.mode !== "stagiaire" && z2.apprentis.length) ? `${z2.apprentis.length} inscrit${z2.apprentis.length>1?"s":""}${placesRestantes(z2) ? " + " + placesRestantes(z2) + " place(s) prévue(s)" : ""}` : (globalOk(z2) ? `${nb(z2.nb)} × ${nb(z2.pec)} € × ${moisGlobal(z2)}/12` : "rentrée à compléter"));
    left = `<div class="big num" style="color:${col.c}">${eur(c.cur*k)}</div><div class="tiny num">${d1}</div>${absNote(f)}` + (c.manquants ? `<div class="warn tiny num">${c.manquants} ${lblP} manquant(s)</div>` : "");
    right = `<div class="big num">${eur(c.tot*k)}</div><div class="tiny num" style="color:var(--new)">${z2.actif ? `dont rentrée ${YEAR} ` + eur(c.prev*k) + " (" + d2 + ")" : d2}</div>`;
  }
  const n1 = effectifZone(z1, f.apprentis);
  const sub = [esc(f.code), n1 ? `${n1} ${mots.personne}${n1>1?"s":""}` : ""].filter(Boolean).join(" · ");
  return `<tr><td><div class="fname">${esc(f.nom)}</div><div class="fsub">${sub}</div><div class="fsub">${esc(classTxt(f))}</div></td><td class="money">${left}</td>${cells}<td class="money">${right}</td></tr>`;
}

function zoneApprResultat(o, quoi){
  const z = quoi === "cours" ? o.ap26 : o.ap27, liste = quoi === "cours" ? o.apprentis : o.ap27.apprentis;

function perChamps(o, p, key, bdc){

function zoneUniResultat(o, cat, quoi){

/* Éléments du bon de commande : montant TTC = parcours × heures centre × prix unitaire */

function montantBDC(o){ return bdcComplet(o) ? Math.round(o.bdcStag * o.bdcHeures * o.bdcPrix * 100) / 100 : null; }

function secCalcul(o, p, cat){

  const optBdc = cat === "apprentissage" ? [] : [["dates",`Automatique : dates et bon de commande (prorata des mois ${YEAR})`], ["bdc","Bon de commande : stagiaires × heures centre × prix du marché"]];

/* Arrondi à l'heure en conservant le total (méthode des plus grands restes) */
function arrondirPlan(cible){
  const visee = Math.round(cible.reduce((t,x) => t + (isNum(x) ? x : 0), 0));
  const arr2 = cible.map(x => isNum(x) ? Math.floor(x) : null);
  let reste = visee - arr2.reduce((t,x) => t + (isNum(x) ? x : 0), 0);
  const ordre = cible.map((x,i) => ({i, f: isNum(x) ? x - Math.floor(x) : -1})).filter(o => o.f >= 0).sort((a,b) => b.f - a.f || a.i - b.i);
  for (let n = 0; reste > 0 && ordre.length; n++, reste--) arr2[ordre[n % ordre.length].i] += 1;
  return {arr: arr2.map(x => isNum(x) && x === 0 ? null : x), total: visee};
}
/* Mois actifs de la formation en N et part de N dans la durée totale */
function fenetre2027(o){
  const d = parseDate(o.debut), fn = parseDate(o.fin);
  if (!d || !fn || o.datesAPreciser) return null;
  const idx = x => x.y * 12 + x.m - 1;
  const nbMois = idx(fn) - idx(d) + 1; if (nbMois <= 0) return null;
  const m0 = Math.max(idx(d), YEAR*12) - YEAR*12, m1 = Math.min(idx(fn), YEAR*12 + 11) - YEAR*12;
  if (m1 < m0) return {m0, m1, part: 0};
  return {m0, m1, part: (m1 - m0 + 1) / nbMois};
}
/* Heures attendues en N d'après le parcours et les dates */
function attendu2027(o, arr){
  const total = arr === "planC" ? o.bdcHeures : o.hEnt;
  const w = fenetre2027(o);
  if (!isNum(total) || !w) return null;
  return Math.round(total * w.part);
}
/* Recale le planning N sur les dates et les heures du parcours :
   mois hors de la période vidés ; profil existant conservé et mis à l'échelle ; sinon répartition égale */
function recaler(o, arr){
  const total = arr === "planC" ? o.bdcHeures : o.hEnt;
  const w = fenetre2027(o);
  if (!isNum(total) || !w) return null;
  const cible = total * w.part;
  const dans = m => m >= w.m0 && m <= w.m1;
  const cur = o[arr].map((x,m) => dans(m) && isNum(x) ? x : null);
  const s = cur.reduce((t,x) => t + (isNum(x) ? x : 0), 0);
  let prop;
  if (s > 0) prop = cur.map(x => isNum(x) ? x * cible / s : null);
  else { const n = w.m1 - w.m0 + 1; prop = Array.from({length:12}, (_,m) => dans(m) && n > 0 ? cible / n : null); }
  const r = arrondirPlan(prop);
  o[arr] = r.arr;
  return r.total;
}
/* Répartit les heures du parcours sur les mois de N :
   - si le planning a déjà des heures : mise à l'échelle proportionnelle (même profil mois par mois) ;
   - sinon : part des mois de N dans la durée de la formation, répartie à parts égales. */
function repartir(o, arr, ancien, nouveau){
  const cur = o[arr];
  const total = isNum(nouveau) ? nouveau : 0;
  const somme12 = cur.reduce((t,x) => t + (isNum(x) ? x : 0), 0);
  let cible;
  if (somme12 > 0 && isNum(ancien) && ancien > 0) {
    const f = total / ancien;
    cible = cur.map(x => isNum(x) ? x * f : null);
  } else if (somme12 > 0) {
    return null; /* pas de référence pour une mise à l'échelle : on garde le planning saisi */
  } else {
    const d = parseDate(o.debut), fn = parseDate(o.fin);
    if (!d || !fn || o.datesAPreciser || !total) return null;
    const idx = x => x.y * 12 + x.m - 1;
    const nbMois = idx(fn) - idx(d) + 1; if (nbMois <= 0) return null;
    const m0 = Math.max(idx(d), YEAR*12), m1 = Math.min(idx(fn), YEAR*12 + 11);
    if (m1 < m0) return null;
    const part = total * (m1 - m0 + 1) / nbMois;
    cible = Array.from({length:12}, (_,m) => (YEAR*12 + m >= m0 && YEAR*12 + m <= m1) ? part / (m1 - m0 + 1) : null);
  }
  const r = arrondirPlan(cible);

  return r.total;
}

  { const av = document.getElementById("avis-vide"); if (av && !sansInfo(o, cat) && av.textContent) { av.textContent = ""; av.className = ""; av.removeAttribute("style"); } }
  for (let m = 0; m < 12; m++) hint("plan-m"+m, totalMoisTxt(o, m));
}

const armed = new WeakMap();
function confirmer(btn, label, fn){
  if (armed.get(btn)) { armed.delete(btn); fn(); return; }
  const old = btn.textContent; btn.textContent = label; btn.classList.add("armed"); armed.set(btn, true);
  setTimeout(() => { if (armed.get(btn)) { armed.delete(btn); btn.textContent = old; btn.classList.remove("armed"); } }, 4000);
}

function openCard(key){ sel = key; renderEdit(); const m = document.querySelector("#view-edit .ed-main"); if (m) m.scrollIntoView({block:"start"}); }
function exporter(){
  try {
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    const d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = `planning-ca-${YEAR}-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("Copie enregistrée dans vos téléchargements");
  } catch(e){ toast("Impossible d'enregistrer la copie"); }
}
function importer(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!valideStructure(d)) throw new Error("format");
      state = migrer(normalise(d)); save(); renderAll(); toast("Copie ouverte");
    } catch(e){ toast("Ce fichier n'est pas une copie valide du planning"); }
  };
  r.onerror = () => toast("Lecture du fichier impossible");
  r.readAsText(file);
}

function ajouterEtab(){

  const id = nouvelId();
  state.etabs.push({id, nom});
  state.sites[id] = siteVide();
  if (!site) site = id;

  const n = document.getElementById("in-new-etab"); if (n) n.focus();

document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) { e.preventDefault(); enregistrer(); } });
document.addEventListener("click", onClick);
/* Fiabilité : enregistrement immédiat quand on quitte ou masque la page (pas de perte de la dernière frappe) */
const flush = () => { if (!state) return; clearTimeout(saveT); try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(KEY+"-ui", JSON.stringify({v:5, site, view, affichage})); } catch(e) {} };
window.addEventListener("pagehide", flush);
window.addEventListener("beforeunload", flush);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flush(); });
/* Fiabilité : le planning ouvert dans un autre onglet reste synchronisé (sinon un onglet écraserait l'autre) */
window.addEventListener("storage", e => {
  if (e.key !== KEY || !e.newValue) return;
  try { const d = JSON.parse(e.newValue); if (!valideStructure(d)) return; state = migrer(normalise(d)); renderAll(); toast("Données mises à jour depuis un autre onglet"); } catch(err) {}
});
document.getElementById("file-in").addEventListener("change", e => { const f=e.target.files && e.target.files[0]; if (f) importer(f); e.target.value=""; });

state = donneesOrigine();
load();
if (!state.etabs.length) view = "intro";
renderAll();
if (!storageOK) setStatus("Enregistrement automatique indisponible : pensez à « Enregistrer une copie »", false);
</script>
</body>
</html>
